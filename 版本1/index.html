<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>猜數字 X A Y B｜版本1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f2e9;color:#23443d;font-family:system-ui,"Microsoft JhengHei",sans-serif;padding:28px 16px;line-height:1.65}
main{max-width:850px;margin:auto}h1{font-size:clamp(30px,6vw,44px);margin:4px 0}.muted{color:#64766c}.panel{background:white;border:1px solid #d1dcd1;border-radius:22px;padding:24px;margin:18px 0;box-shadow:0 12px 35px #274b3e0b}
input{width:100%;padding:14px;border:2px solid #a3b9ac;border-radius:12px;font-size:24px;margin:8px 0 12px}button{border:0;border-radius:12px;padding:12px 18px;background:#315e4f;color:white;font-size:16px;cursor:pointer;margin:5px}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:8px}.debug{background:#edf0ec;padding:12px;border-radius:10px;color:#52665b}.debug.on{background:#fff1d8;color:#855b16}.item{border-bottom:1px solid #e5e9e3;padding:10px 0}#message{font-weight:700;min-height:30px;color:#315e4f}
</style></head><body><main><p class="muted">數位科技概論・階段1</p><h1>猜數字 X A Y B</h1><p class="muted">猜出四位數密碼。A 代表數字與位置都正確；B 代表數字正確但位置不同。</p>

<section class="panel"><h2>開始挑戰</h2><p>答案由 0～9 中選出四個不重複數字，可能以 0 開頭。</p><label for="guess">輸入四位數</label><input id="guess" inputmode="numeric" maxlength="4" placeholder="例如 1234"><div class="actions"><button id="submit">送出猜測</button><button id="new">開新局</button><button id="toggle">切換除錯模式</button></div><p id="message">準備開始</p><p>本局猜測次數：<b id="count">0</b></p><p id="debug" class="debug">除錯模式已關閉</p></section>

<section class="panel"><h2>遊戲規則</h2><p><b>XA</b>：數字及位置都正確。<br><b>YB</b>：數字正確但位置不同。<br><b>4A0B</b>：成功猜中！</p></section>
<section class="panel"><h2>本局紀錄</h2><div id="history" class="history">尚無紀錄</div></section></main><script>
const MODE="basic";
let answer="", guesses=[], rounds=[], selected=null, debug=false, busy=false;
const $=id=>document.getElementById(id);
function newAnswer(){return [...Array(10).keys()].sort(()=>Math.random()-.5).slice(0,4).join("");}
function makeId(){return (crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).replace(/-/g,"");}
function score(g,a){let A=0,B=0;for(let i=0;i<4;i++){if(g[i]===a[i])A++;else if(a.includes(g[i]))B++;}return `${A}A${B}B`;}
function render(){
 $('count').textContent=guesses.length;
 $('debug').textContent=debug?`本局答案：${answer}`:"除錯模式已關閉";
 $('debug').className=debug?"debug on":"debug";
 $('history').innerHTML=rounds.length?rounds.map((r,i)=>`<div class="item"><b>第${i+1}局｜${r.status==="won"?"已完成":"未完成"}</b><br>${(r.guesses||[]).map(g=>`${g.value} → ${g.result}`).join("　")||"尚未猜測"}</div>`).join(""):"尚無紀錄";
 $('submit').disabled=selected?.status==="won"||busy;
}
function addHistory(value,result){guesses.push({value,result,at:new Date().toLocaleString()});}
function showMessage(t){$('message').textContent=t;}
function startLocal(){answer=newAnswer();guesses=[];selected={status:"playing"};debug=false;render();showMessage("新的一局開始！");}
function valid(v){return /^\\d{4}$/.test(v)&&new Set(v).size===4;}
function submitLocal(){
 const v=$('guess').value.trim();
 if(!valid(v)){showMessage("請輸入四位不重複數字（可用 0 開頭）。");return;}
 const result=score(v,answer);addHistory(v,result);showMessage(`本次結果：${result}`);
 if(result==="4A0B"){selected.status="won";showMessage("恭喜你，猜中了！4A0B");}
 rounds[rounds.length-1]={status:selected.status,guesses:[...guesses]};
 $('guess').value="";render();
}
$('submit').onclick=()=>{if(cloud)cloudGuess();else submitLocal();};
$('new').onclick=()=>{if(cloud)cloudNew();else{if(rounds.length&&selected)rounds[rounds.length-1]={status:selected.status,guesses:[...guesses]};rounds.push({status:"playing",guesses:[]});startLocal();}};
$('toggle').onclick=()=>{debug=!debug;render();};
$('guess').addEventListener("keydown",e=>{if(e.key==="Enter")$('submit').click();});
if(!cloud){rounds.push({status:"playing",guesses:[]});startLocal();}

async function apiCall(payload){
 return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||String(e)))).api(payload));
}
async function cloudLoad(){
 try{busy=true;render();const r=await apiCall({action:"load",code:$('code')?.value||""});rounds=r.rounds||[];selected=rounds.find(x=>x.id===r.selectedId)||rounds.find(x=>x.status==="playing")||null;if(selected){guesses=selected.guesses||[];answer=selected.answer||"";}render();showMessage(r.message||"已讀取");}
 catch(e){showMessage(e.message);}finally{busy=false;render();}
}
async function cloudNew(){
 try{busy=true;render();const r=await apiCall({action:"new",code:$('code')?.value||"",requestId:makeId()});rounds=r.rounds||[];selected=rounds.find(x=>x.id===r.selectedId);guesses=selected?.guesses||[];answer="";debug=false;render();showMessage(r.message);}
 catch(e){showMessage(e.message);}finally{busy=false;render();}
}
async function cloudGuess(){
 const v=$('guess').value.trim();if(!valid(v)){showMessage("請輸入四位不重複數字（可用 0 開頭）。");return;}
 try{busy=true;render();const r=await apiCall({action:"guess",code:$('code')?.value||"",gameId:selected?.id,value:v,requestId:makeId(),revision:selected?.revision});rounds=r.rounds||[];selected=rounds.find(x=>x.id===r.selectedId);guesses=selected?.guesses||[];$('guess').value="";showMessage(r.message);render();}
 catch(e){showMessage(e.message);}finally{busy=false;render();}
}
if(MODE==="cloud"){
 $('load').onclick=cloudLoad;
 $('code').value=localStorage.getItem("xaxb-code")||"";
 $('code').addEventListener("change",()=>localStorage.setItem("xaxb-code",$('code').value));
}
if(MODE==="user"){
 $('create').onclick=async()=>{try{const r=await apiCall({action:"create",consent:true});rounds=r.rounds||[];showMessage(r.message);render();}catch(e){showMessage(e.message);}};
 $('account').textContent="使用目前登入並授權的 Google 帳號；每個帳號只會讀寫自己的試算表。";
 cloudLoad=async function(){try{const r=await apiCall({action:"load"});rounds=r.rounds||[];selected=rounds.find(x=>x.status==="playing")||null;guesses=selected?.guesses||[];render();showMessage(r.message);}catch(e){showMessage(e.message);}};
 cloudNew=async function(){try{const r=await apiCall({action:"new",requestId:makeId()});rounds=r.rounds||[];selected=rounds.find(x=>x.id===r.selectedId);guesses=selected?.guesses||[];render();showMessage(r.message);}catch(e){showMessage(e.message);}};
 cloudGuess=async function(){const v=$('guess').value.trim();if(!valid(v)){showMessage("請輸入四位不重複數字。");return;}try{const r=await apiCall({action:"guess",gameId:selected?.id,value:v,requestId:makeId(),revision:selected?.revision});rounds=r.rounds||[];selected=rounds.find(x=>x.id===r.selectedId);guesses=selected?.guesses||[];$('guess').value="";render();showMessage(r.message);}catch(e){showMessage(e.message);}};
}
if(cloud && MODE==="cloud") $('load').click();
if(cloud && MODE==="user") cloudLoad();
</script></body></html>
